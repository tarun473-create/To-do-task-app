<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task360 — Team Performance & Accountability Hub</title>
  <meta name="description" content="Team task management, accountability and KPI tracking for department heads, managers and employees.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">360</div>
      <div class="brand-text"><b>Task360</b><span>Performance &amp; Accountability</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot" id="sidebarFoot"></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn mobile-menu" id="mobileMenu" title="Menu">☰</button>
      <button class="icon-btn collapse-btn" id="collapseBtn" title="Collapse sidebar">⇤</button>
      <div class="search">
        <input id="globalSearch" type="search" placeholder="Search tasks, IDs, people, departments…" autocomplete="off">
        <div class="search-results hidden" id="searchResults"></div>
      </div>
      <div class="spacer"></div>
      <span class="demo-badge" title="All records are demonstration data stored in this browser only">DEMO DATA</span>
      <label class="role-switch" title="Sign in as (demo)"><select id="userSwitch"></select></label>
      <button class="btn primary" id="newTaskBtn">＋ New task</button>
      <button class="icon-btn" id="themeBtn" title="Toggle light/dark">🌓</button>
      <button class="icon-btn" id="bellBtn" title="Notifications">🔔<span class="dot hidden" id="bellDot"></span></button>
      <div class="notif-panel hidden" id="notifPanel"></div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div id="layer"></div>
<div class="toast-wrap" id="toasts"></div>

<script src="js/store.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
