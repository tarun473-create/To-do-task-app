# Runs the Task360 follow-up engine and sends queued Outlook / Teams notifications.
# Setup: repository Settings → Secrets and variables → Actions → add
#   TASK360_URL          e.g. https://task360.yourcompany.com  (no trailing slash)
#   TASK360_CRON_SECRET  the same value as CRON_SECRET on the server
# Until both secrets exist the job exits immediately without doing anything.
name: Task360 follow-up engine

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (GitHub may delay scheduled runs)
  workflow_dispatch:

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron
        env:
          TASK360_URL: ${{ secrets.TASK360_URL }}
          CRON_SECRET: ${{ secrets.TASK360_CRON_SECRET }}
        run: |
          if [ -z "$TASK360_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "TASK360_URL / TASK360_CRON_SECRET not configured — skipping."
            exit 0
          fi
          curl -fsS --retry 2 --max-time 90 -X POST -H "Authorization: Bearer $CRON_SECRET" "$TASK360_URL/api/cron"
